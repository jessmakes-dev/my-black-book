<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A private book for remembering the little things about the people in your life.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Black Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6A43DE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Baloo+2:wght@600&family=Lilita+One&family=Fraunces:opsz,wght@9..144,600&family=DM+Serif+Display&family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column with a sticky top bar, soft cards only where grouping matters, and a floating add button */
:root{
  --bg:#F6F3FF; --surface:#FFFFFF; --surface-2:#EFEAFD; --ink:#1E1636; --muted:#686183; --line:#E1DAF3;
  --accent:#6A43DE; --accent-ink:#FFFFFF; --accent-soft:#ECE5FF; --accent-text:#5532C4;
  --danger:#B42F47; --danger-soft:#FBE4E8; --warn-soft:#FFF1D6; --warn-ink:#7A4E0C; --ok:#1C7F55;
  --c1b:#ECE5FF; --c1f:#4A2FB0; --c2b:#FDE6DE; --c2f:#8A3A1E; --c3b:#DBF2EA; --c3f:#0F6250;
  --c4b:#E1EDFB; --c4f:#1B4F86; --c5b:#FBEED4; --c5f:#7A4E0C; --c6b:#FBE4EE; --c6f:#8A2D55;
  --shadow:0 1px 2px rgba(45,25,100,.06),0 8px 24px rgba(45,25,100,.07);
  --scrim:rgba(20,12,40,.38);
  --font-display:"Fredoka",ui-rounded,"Nunito",system-ui,sans-serif;
  --font-name:"Fraunces",Georgia,serif; --name-adjust:none;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111F; --surface:#211B33; --surface-2:#2A2341; --ink:#F2EEFF; --muted:#ABA3C8; --line:#382F55;
  --accent:#A78BFF; --accent-ink:#17102C; --accent-soft:#33295A; --accent-text:#C4B2FF;
  --danger:#FF8FA2; --danger-soft:#4A1E2A; --warn-soft:#4A3510; --warn-ink:#F6D79C; --ok:#7FD9AE;
  --c1b:#3A2E72; --c1f:#DCD3FF; --c2b:#5A2A1C; --c2f:#F8CDBE; --c3b:#134A3E; --c3f:#A8E6D3;
  --c4b:#1A3A5E; --c4f:#BCD7F5; --c5b:#5A3D0E; --c5f:#F6D79C; --c6b:#5A2140; --c6f:#F5C1D7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15111F; --surface:#211B33; --surface-2:#2A2341; --ink:#F2EEFF; --muted:#ABA3C8; --line:#382F55;
  --accent:#A78BFF; --accent-ink:#17102C; --accent-soft:#33295A; --accent-text:#C4B2FF;
  --danger:#FF8FA2; --danger-soft:#4A1E2A; --warn-soft:#4A3510; --warn-ink:#F6D79C; --ok:#7FD9AE;
  --c1b:#3A2E72; --c1f:#DCD3FF; --c2b:#5A2A1C; --c2f:#F8CDBE; --c3b:#134A3E; --c3f:#A8E6D3;
  --c4b:#1A3A5E; --c4f:#BCD7F5; --c5b:#5A3D0E; --c5f:#F6D79C; --c6b:#5A2140; --c6f:#F5C1D7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{background:var(--bg);font-synthesis-weight:none}
/* name font choices: the title and people's names */
:root[data-font="baloo"]{--font-name:"Baloo 2",ui-rounded,system-ui,sans-serif}
:root[data-font="lilita"]{--font-name:"Lilita One",ui-rounded,system-ui,sans-serif}
:root[data-font="fredoka"]{--font-name:"Fredoka",ui-rounded,"Nunito",system-ui,sans-serif}
:root[data-font="dmserif"]{--font-name:"DM Serif Display",Georgia,serif}
:root[data-font="caveat"]{--font-name:"Caveat","Segoe Print",cursive;--name-adjust:.56}
.nm,.top h1,.hero h2,.gate h1{font-family:var(--font-name);font-size-adjust:var(--name-adjust)}
.nm{font-weight:600}
.fontopt{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;text-align:left}
.fontopt.on{border-color:var(--accent);background:var(--accent-soft)}
.fontopt .smp{flex:1;min-width:0;font-size:22px;line-height:1.2;color:var(--ink)}
.fontopt .fl{font-size:13px;color:var(--muted);font-weight:700;display:block;font-family:var(--font-body)}
.fontopt .ok{color:var(--accent-text)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:4px;padding-block:10px;margin-inline:-4px}
.top h1{font-weight:600;font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.brand{display:inline-flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;color:var(--muted);margin-top:4px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;flex:1;min-width:0}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 4px 10px}
.sec h2{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.sec small{color:var(--muted);font-size:13px}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;width:100%;background:transparent;border:0;text-align:left;cursor:pointer}
.row:hover{background:var(--surface-2)}
.list>.row:first-child{border-radius:var(--r) var(--r) 0 0}.list>.row:last-child{border-radius:0 0 var(--r) var(--r)}.list>.row:only-child{border-radius:var(--r)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.row .s{color:var(--muted);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.row .when.late{color:var(--danger)}
.row .when.now{color:var(--accent-text)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.ico.bday{background:var(--c6b);color:var(--c6f)}
.tick{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick svg{width:18px;height:18px}
.today-row{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft))}

.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;font-family:var(--font-display)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.xl{width:96px;height:96px;font-size:34px}
.h1{background:var(--c1b);color:var(--c1f)}.h2{background:var(--c2b);color:var(--c2f)}.h3{background:var(--c3b);color:var(--c3f)}
.h4{background:var(--c4b);color:var(--c4f)}.h5{background:var(--c5b);color:var(--c5f)}.h6{background:var(--c6b);color:var(--c6f)}
.h0{background:var(--surface-2);color:var(--muted)}
.sec .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
.chip .cnt{background:var(--accent-soft);color:var(--accent-text);border-radius:999px;font-size:12px;padding:0 7px;line-height:1.5}
.chip.on .cnt{background:var(--accent-ink);color:var(--accent)}
.hintcard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-text);animation:rise .2s ease-out both}
.hintcard .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.hintcard b{color:var(--ink);font-weight:800}
.hintcard .grow span{font-size:13px;color:var(--muted)}
.hintcard button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;white-space:nowrap}
.hintcard.done{font-weight:700;font-size:14px}
.teampick{border-top:1px dashed var(--line);padding-top:10px}

.labels{display:flex;flex-wrap:wrap;gap:6px}
.lab{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;line-height:1.5}
.tag-sample{border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-height:38px;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip svg{width:16px;height:16px;stroke-width:2.4}
.chip.add{border-style:dashed;color:var(--accent-text);background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.addwrap{display:inline-flex;gap:6px;align-items:center;flex:1 1 220px;min-width:0}
.addwrap input{flex:1;min-width:0;padding:8px 12px;border-radius:999px}

.backup{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:14px;margin-top:12px}
.backup span{flex:1;min-width:0}
.backup.stale{background:var(--warn-soft);color:var(--warn-ink)}
.backup button{border:0;background:var(--surface);color:var(--accent-text);border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:14px}

.empty{text-align:center;padding:26px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:19px;margin-bottom:4px}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 26px rgba(90,50,200,.38);cursor:pointer;z-index:8;transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab.open{transform:rotate(45deg)}
.fabmenu{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:8}
.fabmenu button{display:flex;align-items:center;gap:10px;background:var(--surface);border:0;border-radius:999px;padding:12px 18px 12px 14px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;animation:rise .18s ease-out both}
.fabmenu button:nth-child(2){animation-delay:.04s}
.fabmenu svg{color:var(--accent-text)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:7;animation:fade .15s both}

/* profile */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 4px}
.hero h2{font-weight:600;font-size:28px;margin:4px 0 0;line-height:1.15;text-wrap:balance}
.hero .nick{color:var(--muted);margin-top:-4px}
.linked{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.linkchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.linkchip svg{width:16px;height:16px;color:var(--accent-text)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.facts{padding:4px 16px}
.fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.fact+.fact{border-top:1px solid var(--line)}
.fact svg{color:var(--accent-text);margin-top:1px}
.fact .k{font-size:13px;color:var(--muted);font-weight:700;display:block}
.fact .v{display:block;overflow-wrap:anywhere}
.fact .v .chips{margin-top:6px;gap:6px}
.mini{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink)}
.mindful{display:flex;gap:12px;background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.mindful b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.note{padding:14px 16px}
.note+.note{border-top:1px solid var(--line)}
.note .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.note p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note .with{font-size:13px;color:var(--muted);margin-top:6px}
.note .edit{margin-left:auto;border:0;background:transparent;color:var(--accent-text);font-weight:800;font-size:13px;cursor:pointer;padding:4px}
.timeline{position:relative}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.group>h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px;display:flex;align-items:center;gap:8px}
.group>h3 svg{color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:14px;font-weight:800;color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search]:not(.bare),select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:16px;outline:none;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.triple{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.rowin{display:flex;gap:8px;align-items:center}
.rowin>input{flex:1}
.rowin .yr{flex:0 0 120px}
.subcard{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px}
.subcard .rowin{align-items:flex-start}
.rm{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.rm svg{width:18px;height:18px}
.addrow{align-self:flex-start;border:1.5px dashed var(--line);background:transparent;color:var(--accent-text);border-radius:999px;padding:8px 14px;font-weight:800;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.addrow svg{width:18px;height:18px}
.err{color:var(--danger);font-size:14px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:50px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.65;cursor:progress}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.ghost{background:transparent;color:var(--accent-text);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;margin-top:6px}
.savebar .btn{width:100%;box-shadow:0 10px 26px rgba(90,50,200,.3)}
.confirm{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:10px;font-weight:700}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.confirm .btn{flex:1;min-height:44px;padding:10px 14px}

/* lock and start */
.gate{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:24px;max-width:400px;margin:0 auto}
@supports (height:100dvh){.gate{min-height:calc(100dvh - 40px)}}
.gate h1{font-weight:600;font-size:34px;margin:6px 0 0;letter-spacing:-.01em}
.gate p{margin:0;color:var(--muted);max-width:32ch}
.gate .stack{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:10px}
.pin{text-align:center;font-size:30px !important;letter-spacing:.5em;padding:14px !important;font-family:var(--font-display)}
.linkbtn{border:0;background:transparent;color:var(--accent-text);font-weight:800;cursor:pointer;padding:8px;font-size:15px}
.logo{filter:drop-shadow(0 10px 20px rgba(90,50,200,.25))}
.ro-banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--accent-text);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:6px}
.ro-pill{font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:3px 10px}
.prose{color:var(--muted);font-size:14px;margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kv b{font-weight:800}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:800;font-size:15px;opacity:0;pointer-events:none;z-index:60;max-width:calc(100vw - 40px);text-align:center;transition:opacity .2s}
#toast.show{opacity:1;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@keyframes pop{0%{transform:translate(-50%,24px) scale(.9);opacity:0}60%{transform:translate(-50%,-6px) scale(1.04);opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
.dots{display:flex;gap:14px;justify-content:center;align-items:center;min-height:22px;margin-top:4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block;transition:background-color .1s,transform .1s}
.dots i.f{background:var(--accent);transform:scale(1.08)}
.dots.shake{animation:shake .4s}
.dots.checking i{animation:blink 1s ease-in-out infinite}
.dots.checking i:nth-child(2){animation-delay:.12s}.dots.checking i:nth-child(3){animation-delay:.24s}.dots.checking i:nth-child(4){animation-delay:.36s}.dots.checking i:nth-child(5){animation-delay:.48s}.dots.checking i:nth-child(6){animation-delay:.6s}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 28px;justify-content:center;margin-top:6px}
.key{width:72px;height:72px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--ink);cursor:pointer;touch-action:manipulation;display:grid;place-items:center;user-select:none;-webkit-user-select:none;transition:transform .08s,background-color .08s}
.key:active{background:var(--accent-soft);transform:scale(.94)}
.key.fn{background:transparent;box-shadow:none;color:var(--muted)}
.key.fn.ok{color:var(--accent-text)}
.key svg{width:26px;height:26px}
.gate.locking{gap:10px}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}#toast.show{transform:translate(-50%,0)}}
@media (max-width:380px){.iconbtn{width:40px;height:40px}.top{gap:2px}.triple{grid-template-columns:1fr 1fr}.triple>:last-child{grid-column:1/-1}.rowin .yr{flex-basis:96px}}

function snippet(text, q) { const i = text.toLowerCase().indexOf(q); const s = Math.max(0, i - 24); return (s > 0 ? '…' : '') + text.slice(s, i + q.length + 40) + (i + q.length + 40 < text.length ? '…' : ''); }

function links(p) {
  const out = [];
  for (const c of p.connections) { const o = person(c.id); if (o) out.push({ id: o.id, text: `${c.how || 'Linked to'} ${o.name}` }); }
  for (const o of S.data.people) { if (o.id === p.id) continue; for (const c of o.connections) if (c.id === p.id) out.push({ id: o.id, text: `${o.name} · ${c.how || 'Linked to'} ${firstName(p.name)}` }); }
  return out;
}

const NUMW = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, couple: 2, few: 3 };

const MONTHW = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const NUM = '(\\d+|a couple of|a few|an|a|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)';
const UNIT = '(days|day|weeks|week|fortnights|fortnight|months|month)';

function render() {
  const v = V[S.view] || V.home;
  if (!S.data && !['start', 'setup', 'lock', 'pass', 'openbk', 'bkchoice', 'restorepin'].includes(S.view)) S.view = S.vault ? 'lock' : 'start';
  app.innerHTML = (V[S.view] || v)();
  afterRender();
}
function fitTitles() {
  document.querySelectorAll('.top h1').forEach(h => {
    h.style.fontSize = ''; let size = parseFloat(getComputedStyle(h).fontSize);
    while (h.scrollWidth > h.clientWidth + 1 && size > 14) { size -= 1; h.style.fontSize = size + 'px'; }
  });
}
function afterRender() {
  fitTitles();
  if (S.view === 'pass') setTimeout(() => $('#passin') && $('#passin').focus(), 50);
  if (!S.data) return;
  const t = todayISO();
  if (S.view === 'home' && !S.q) { const has = S.data.people.some(p => { const nb = nextBday(p.birthday); return nb && nb.days === 0; }); if (has && !S.celebrated['home' + t]) { S.celebrated['home' + t] = 1; setTimeout(confetti, 250); } }
  if (S.view === 'person') { const p = person(S.pid); const nb = p && nextBday(p.birthday); if (nb && nb.days === 0 && !S.celebrated[p.id + t]) { S.celebrated[p.id + t] = 1; setTimeout(confetti, 250); } }
}
function showErr(id, msg) { const el = document.getElementById(id); if (el) { el.textContent = msg; el.hidden = !msg; } }
function busy(id, on, label) { const b = document.getElementById(id); if (!b) return; if (on) { b.dataset.label = b.innerHTML; b.disabled = true; b.innerHTML = `<span class="spin"></span>${label || 'Working…'}`; } else { b.disabled = false; if (b.dataset.label) b.innerHTML = b.dataset.label; } }
const cryptoOk = () => !!(window.crypto && crypto.subtle);
const val = id => (document.getElementById(id) || {}).value || '';

/* ---------- open / lock ---------- */
async function openWithKey(raw, vault) {
  S.raw = raw; S.ck = await importDataKey(raw);
  S.data = migrate(await decryptData(S.ck, vault.data));
  S.readOnly = false; S.stack = []; S.q = ''; S.filter = 'All'; S.gateMsg = '';
  S.lastActive = Date.now(); S.hiddenAt = 0;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if (S.pending === 'note') { S.pending = null; S.view = 'home'; render(); A.newnote(); return; }
  S.view = 'home'; render();
}
function lock(msg) {
  const wasRO = S.readOnly;
  S.raw = null; S.ck = null; S.data = null; S.form = null; S.nf = null; S.ap = null; S.bk = null; S.readOnly = false; S.roSaved = null; S.stack = []; S.fab = false; S.setOpen = null; S.adding = null; S.q = '';
  S.gateMsg = msg || ''; S.pinEntry = ''; S.pinBusy = false;
  S.view = S.vault ? (S.vault.fails >= MAX_TRIES ? 'pass' : 'lock') : 'start';
  render();
  if (wasRO) toast('Backup closed');
}

/* ---------- calendar + backup ---------- */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
async function shareOrDownload(blob, name, title) {
  try { const file = new File([blob], name, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return 'shared'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return 'downloaded'; } catch (e) { return 'failed'; }
}
async function addToCalendar(title, date, yearly) {
  if (IN_FRAME) { toast('Adding to your calendar works once the app is installed.'); return; }
  const ds = date.replace(/-/g, ''), de = addDays(date, 1).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//My Black Book//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT', `UID:${uid()}@my-black-book`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds}`, `DTEND;VALUE=DATE:${de}`, yearly ? 'RRULE:FREQ=YEARLY' : '', `SUMMARY:${icsEsc(title)}`, 'TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  const r = await shareOrDownload(new Blob([ics], { type: 'text/calendar' }), `${title.replace(/[^\w ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'event'}.ics`, title);
  if (r === 'shared') toast('Pick Calendar to add it');
  else if (r === 'downloaded') toast('Tap Open on the download, then choose Calendar to add it.');
  else if (r === 'failed') toast("Couldn't create the calendar event.");
}
async function doBackup() {
  if (S.readOnly) return;
  if (IN_FRAME) { toast('Saving to Drive works once the app is installed.'); return; }
  const saved = new Date().toISOString();
  const prev = S.data.settings.lastBackup; S.data.settings.lastBackup = saved;
  const payload = { app: 'my-black-book', v: 1, saved, pass: S.vault.pass, data: await encryptData(S.ck, S.data) };
  const r = await shareOrDownload(new Blob([JSON.stringify(payload)], { type: 'text/plain' }), `my-black-book-backup-${todayISO()}.txt`, 'My Black Book backup');
  if (r === 'cancelled' || r === 'failed') { S.data.settings.lastBackup = prev; toast(r === 'failed' ? "Couldn't save the backup." : 'Backup not saved'); return; }
  await persist(); render();
  toast(r === 'shared' ? 'Backup ready. Pick Drive to save it.' : 'Backup downloaded. Move it to your Drive folder.');
}

/* ---------- forms ---------- */
const FORMS = {
  async setup() {
    const pin = val('s-pin'), pin2 = val('s-pin2'), pass = val('s-pass'), pass2 = val('s-pass2');
    if (!cryptoOk()) return showErr('s-err', "This browser can't lock your book securely. Open it in Chrome.");
    if (!/^\d{4,8}$/.test(pin)) return showErr('s-err', 'Your PIN needs 4 to 8 digits.');
    if (pin !== pin2) return showErr('s-err', "The two PINs don't match.");
    if (pass.trim().length < 12) return showErr('s-err', 'Your passphrase needs at least 12 characters. Try "Suggest one for me".');
    if (pass !== pass2) return showErr('s-err', "The two passphrases don't match.");
    if (!$('#s-saved').checked) return showErr('s-err', 'Tick the box once your passphrase is saved somewhere safe.');
    showErr('s-err', ''); busy('s-go', true, 'Locking it up…');
    try {
      const raw = rand(32);
      const [pw, ppw] = await Promise.all([wrapKey(raw, pin), wrapKey(raw, pass)]);
      const ck = await importDataKey(raw);
      const vault = { v: 1, pin: pw, pass: ppw, pinLen: pin.length, fails: 0, created: Date.now(), data: await encryptData(ck, newData($('#s-sample').checked)) };
      await store.set('vault', vault); S.vault = vault; S.pushed = 0;
      await openWithKey(raw, vault); toast('Your book is ready');
    } catch (e) { console.error(e); busy('s-go', false); showErr('s-err', 'Something went wrong setting up. Try again.'); }
  },
  async pin() {
    if (S.pinBusy) return;
    const pin = S.pinEntry;
    if (!/^\d{4,8}$/.test(pin)) return showErr('g-err', 'Enter your 4 to 8 digit PIN.');
    showErr('g-err', ''); S.pinBusy = true; const d = $('#dots'); d && d.classList.add('checking');
    let raw = null;
    try { raw = await unwrapKey(S.vault.pin, pin); } catch (e) { raw = null; }
    S.pinBusy = false;
    if (!raw) {
      S.vault.fails = (S.vault.fails || 0) + 1; await store.set('vault', S.vault);
      S.pinEntry = '';
      if (S.vault.fails >= MAX_TRIES) { replaceView('pass'); return; }
      const dd = $('#dots'); if (dd) { dd.classList.remove('checking'); updateDots(); dd.classList.remove('shake'); void dd.offsetWidth; dd.classList.add('shake'); }
      try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
      const left = MAX_TRIES - S.vault.fails;
      return showErr('g-err', `That PIN didn't match. ${left} ${left === 1 ? 'try' : 'tries'} left before you'll need your passphrase.`);
    }
    S.pinEntry = '';
    let changed = false;
    if (S.vault.fails) { S.vault.fails = 0; changed = true; }
    if (!S.vault.pinLen) { S.vault.pinLen = pin.length; changed = true; }
    if (changed) await store.set('vault', S.vault);
    try { await openWithKey(raw, S.vault); } catch (e) { console.error(e); showErr('g-err', "Your book couldn't be opened."); }
  },
  async pass() {
    const pass = val('passin'); if (!pass) return showErr('g-err', 'Enter your passphrase.');
    showErr('g-err', ''); busy('g-go', true, 'Unlocking…');
    let raw = null; try { raw = await unwrapKey(S.vault.pass, pass); } catch (e) { raw = null; }
    if (!raw) { busy('g-go', false); $('#passin').select(); return showErr('g-err', "That passphrase didn't match. Check for typos and try again."); }
    S.vault.fails = 0; await store.set('vault', S.vault);
    try { await openWithKey(raw, S.vault); } catch (e) { console.error(e); busy('g-go', false); showErr('g-err', "Your book couldn't be opened."); }
  },
  async openbk() {
    const file = ($('#bk-file').files || [])[0]; const pass = val('bk-pass');
    if (!file) return showErr('bk-err', 'Pick your backup file first.');
    if (!pass) return showErr('bk-err', 'Enter your passphrase.');
    showErr('bk-err', ''); busy('bk-go', true, 'Opening…');
    let json; try { json = JSON.parse(await file.text()); } catch (e) { json = null; }
    if (!json || json.app !== 'my-black-book' || !json.pass || !json.data) { busy('bk-go', false); return showErr('bk-err', "That file isn't a My Black Book backup."); }
    let raw; try { raw = await unwrapKey(json.pass, pass); } catch (e) { busy('bk-go', false); return showErr('bk-err', "That passphrase didn't open this backup. Check for typos, or try the passphrase you had when it was saved."); }
    try { const data = await decryptData(await importDataKey(raw), json.data); S.bk = { json, raw, data }; replaceView('bkchoice'); }
    catch (e) { busy('bk-go', false); showErr('bk-err', 'This backup looks damaged. Try another one.'); }
  },
  async restore() {
    const pin = val('r-pin'), pin2 = val('r-pin2');
    if (!/^\d{4,8}$/.test(pin)) return showErr('r-err', 'Your PIN needs 4 to 8 digits.');
    if (pin !== pin2) return showErr('r-err', "The two PINs don't match.");
    showErr('r-err', ''); busy('r-go', true, 'Setting up…');
    try {
      const b = S.bk; const vault = { v: 1, pin: await wrapKey(b.raw, pin), pass: b.json.pass, pinLen: pin.length, fails: 0, created: Date.now(), data: b.json.data };
      await store.set('vault', vault); S.vault = vault; S.bk = null; S.pushed = 0;
      await openWithKey(b.raw, vault); toast('Your book is on this device');
    } catch (e) { console.error(e); busy('r-go', false); showErr('r-err', 'Something went wrong. Try again.'); }
  },
  async person() {
    const f = S.form;
    if (!f.name.trim()) { showErr('e-err', 'Add their name first.'); $('#e-name').focus(); window.scrollTo(0, 0); return; }
    const p = clone(f); delete p.bd;
    p.name = p.name.trim(); p.nickname = p.nickname.trim();
    p.birthday = f.bd.d && f.bd.m ? { d: Number(f.bd.d), m: Number(f.bd.m), y: f.bd.y ? Number(f.bd.y) : null } : null;
    p.kids = p.kids.filter(k => k.name.trim()).map(k => ({ name: k.name.trim(), year: k.year ? Number(k.year) : '' }));
    p.pets = p.pets.filter(x => x.name.trim() || x.type).map(x => ({ name: x.name.trim(), type: x.type }));
    p.connections = p.connections.filter(c => c.id);
    p.parents = p.parents.filter(x => x.name.trim()).map(x => ({ name: x.name.trim(), rel: x.rel || '' }));
    for (const sp of Object.keys(p.teams || {})) if (!p.teams[sp] || !p.teams[sp].length) delete p.teams[sp];
    p.lifeUpdates = p.lifeUpdates.filter(l => l.text.trim()).map(l => ({ text: l.text.trim(), date: l.date || todayISO() }));
    p.updated = Date.now();
    const isNew = !p.id;
    if (isNew) { p.id = uid(); p.created = Date.now(); S.data.people.push(p); } else { const i = S.data.people.findIndex(x => x.id === p.id); S.data.people[i] = p; }
    await persist(); S.form = null; S.adding = null;
    replaceView('person', { pid: p.id }); toast(isNew ? `${firstName(p.name)} added` : 'Saved');
  },
  async note() {
    const f = S.nf;
    if (!f.personIds.length) { showErr('n-err', 'Pick at least one person.'); return; }
    if (!f.text.trim()) { showErr('n-err', 'Add a few words about what you talked about.'); $('#n-text').focus(); return; }
    const due = f.fu !== 'none' ? dueFrom(f) : '';
    if (f.fu !== 'none' && !due) { showErr('n-err', 'Pick a date for the follow-up.'); return; }
    const isNew = !f.id;
    const note = isNew ? { id: uid(), created: Date.now() } : S.data.notes.find(n => n.id === f.id);
    Object.assign(note, { personIds: [...f.personIds], place: f.place || '', date: f.date || todayISO(), text: f.text.trim() });
    if (isNew) S.data.notes.push(note);
    let fu = S.data.followups.find(x => x.noteId === note.id && !x.done);
    if (due) { if (!fu) { fu = { id: uid(), noteId: note.id, done: false }; S.data.followups.push(fu); } Object.assign(fu, { personIds: f.fuFor === 'all' || !f.personIds.includes(f.fuFor) ? [...f.personIds] : [f.fuFor], due, text: f.fuText.trim() }); }
    else if (fu) S.data.followups = S.data.followups.filter(x => x !== fu);
    touch(f.personIds); await persist(); toast('Note saved');
    if (isNew) { const pid = f.personIds[0]; S.nf = null; replaceView('addto', { ap: { personId: pid, personIds: [...note.personIds], kind: null, name: '', year: '', petType: '', interests: clone((person(pid) || {}).interests || []) } }); }
    else { S.nf = null; backAction(); }
  },
  async cpin() {
    const pass = val('c-pass'), pin = val('c-pin'), pin2 = val('c-pin2');
    if (!/^\d{4,8}$/.test(pin)) return showErr('c-err', 'Your new PIN needs 4 to 8 digits.');
    if (pin !== pin2) return showErr('c-err', "The two PINs don't match.");
    busy('c-go', true, 'Changing…');
    try { await unwrapKey(S.vault.pass, pass); } catch (e) { busy('c-go', false); return showErr('c-err', "That passphrase didn't match."); }
    S.vault.pin = await wrapKey(S.raw, pin); S.vault.pinLen = pin.length; S.vault.fails = 0; await store.set('vault', S.vault); S.setOpen = null; render(); toast('PIN changed');
  },
  async cpass() {
    const old = val('c-old'), nw = val('c-new'), nw2 = val('c-new2');
    if (nw.trim().length < 12) return showErr('c-err', 'Your new passphrase needs at least 12 characters.');
    if (nw !== nw2) return showErr('c-err', "The two new passphrases don't match.");
    busy('c-go', true, 'Changing…');
    try { await unwrapKey(S.vault.pass, old); } catch (e) { busy('c-go', false); return showErr('c-err', "Your current passphrase didn't match."); }
    S.vault.pass = await wrapKey(S.raw, nw); await store.set('vault', S.vault); S.setOpen = null; render(); toast('Passphrase changed. Save a new backup.');
  }
};

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.act === 'open' || el.classList.contains('scrim')) e.preventDefault();
  try { await fn(el, e); } catch (err) { console.error(err); toast('Something went wrong. Try again.'); }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault();
  const fn = FORMS[form.dataset.form]; if (!fn) return;
  try { await fn(); } catch (err) { console.error(err); toast('Something went wrong. Try again.'); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { const root = ROOTS[el.dataset.root] && ROOTS[el.dataset.root](); if (root) setP(root, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value); if (el.dataset.root === 'form' && el.dataset.bind === 'name' && !S.form.photo) { const pb = $('#photobox .avatar'); if (pb) pb.innerHTML = el.value ? initials(el.value) : ic('camera'); } }
  if (el.id === 'q') { S.q = el.value; $('#homebody').innerHTML = homeBody(); }
  if (el.dataset.root === 'nf' && (el.dataset.bind === 'text' || el.dataset.bind === 'fuDate')) { clearTimeout(S.hintT); S.hintT = setTimeout(refreshHint, 250); }
  if (el.id === 'nfsearch') { S.nfq = el.value; $('#whosug').innerHTML = whoSug(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('addin')) { e.preventDefault(); A.addopt(e.target); }
  if (e.key === 'Enter' && e.target.id === 'nfsearch') { e.preventDefault(); const first = $('#whosug [data-act="nfadd"]'); if (first) A.nfadd(first); }
  if (S.view === 'lock' && !(e.target.matches && e.target.matches('input,textarea,select'))) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); A.key({ dataset: { val: e.key } }); return; }
    if (e.key === 'Backspace') { e.preventDefault(); A.keydel(); return; }
    if (e.key === 'Enter') { e.preventDefault(); FORMS.pin(); return; }
  }
  if (e.key === 'Escape' && S.fab) { S.fab = false; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('div[data-act="open"]')) { e.preventDefault(); A.open(e.target); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'photo' && el.files && el.files[0]) { try { S.form.photo = await readPhoto(el.files[0]); $('#photobox').innerHTML = photoBox(); } catch (err) { toast("That photo couldn't be read. Try another."); } }
});
function readPhoto(file) {
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file); img.onload = () => { const s = 256, c = document.createElement('canvas'); c.width = s; c.height = s; const x = c.getContext('2d'); const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); }; img.src = url; });
}

/* ---------- auto-lock ---------- */
const markActive = () => { S.lastActive = Date.now(); };
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, markActive, { passive: true }));
function lockLimitMs() { if (!S.data) return 0; const m = S.readOnly ? 5 : S.data.settings.autoLock; return m * 60000; }
document.addEventListener('visibilitychange', () => {
  if (!S.data) return;
  if (document.hidden) { S.hiddenAt = Date.now(); if (lockLimitMs() === 0) lock(); }
  else { if (S.hiddenAt && Date.now() - S.hiddenAt >= lockLimitMs()) lock(); S.hiddenAt = 0; }
});
setInterval(() => { if (!S.data || document.hidden) return; const lim = lockLimitMs() || 300000; if (Date.now() - S.lastActive >= lim) lock(); }, 15000);

/* ---------- boot ---------- */
let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitTitles, 100); });
try { document.fonts && document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', fitTitles); document.fonts.ready.then(fitTitles); } catch (e) {}
(async function boot() {
  applyTheme(prefGet('mbb-theme')); applyFont(prefGet('mbb-font'));
  try { if (new URLSearchParams(location.search).get('action') === 'note') S.pending = 'note'; } catch (e) {}
  S.vault = (await store.get('vault')) || null;
  S.view = S.vault ? (S.vault.fails >= MAX_TRIES ? 'pass' : 'lock') : 'start';
  render();
  if ('serviceWorker' in navigator && !IN_FRAME && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
